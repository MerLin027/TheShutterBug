<body class="bg-background text-on-surface h-screen w-screen overflow-hidden relative font-body-md antialiased">
    <!-- Background Image with Heavy Blur -->
    <div class="absolute inset-0 w-full h-full z-0">
        <img alt="Background" class="w-full h-full object-cover blur-3xl scale-110"
            src="https://lh3.googleusercontent.com/aida/AP1WRLt_p_3taNJFKaIPQ9dLhmTlbuIjeo-4Mdjwxse2woumL9J8YXATt7K8hd6we0SjhDdAByWT6bH_c3Ksfvp5A7jRMee1bxkAfjI0uaOHxbnKXii9cEOZ_Oy354DfKYAfxNL9wGCTmdu05hFGXQntOjXgZoOoYz3dLj7t7ZlJ0y5AG0pdt9wB2Dju5ZaqpVasI-9BrLEkCzh-wXtx5RxXpcNdi6IDR3HflyyhHzAyCf6V70Ux-Y_EbuPgavk">
        <div class="absolute inset-0 bg-moody-overlay mix-blend-multiply"></div>
    </div>
    <!-- Main Content Container -->
    <main
        class="relative z-10 w-full h-full flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
        <!-- Brand Header (Subtle) -->
        <div class="absolute top-8 left-0 w-full flex justify-center opacity-70">
            <h1 class="font-display-lg text-headline-md tracking-tighter text-on-surface">THE SHUTTER BUG</h1>
        </div>
        <!-- Floating Login Card -->
        <div
            class="liquid-glass rounded-xl w-full max-w-sm p-8 flex flex-col gap-8 transform transition-transform hover:scale-[1.01] duration-500">
            <div class="text-center space-y-2">
                <h2 class="font-headline-md text-headline-md text-on-surface">Admin Access</h2>
                <p class="font-label-sm text-label-sm text-on-surface-variant">SECURE PORTAL</p>
            </div>
            <form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
                <div class="space-y-1 group">
                    <label
                        class="font-label-sm text-label-sm text-outline-variant px-1 group-focus-within:text-tertiary transition-colors">Email</label>
                    <input
                        class="w-full bg-transparent border-0 border-b border-white/10 focus:border-tertiary focus:ring-0 text-on-surface font-body-md px-1 py-2 transition-colors placeholder:text-white/10"
                        placeholder="admin@obsidian.com" type="email">
                </div>
                <div class="space-y-1 group">
                    <label
                        class="font-label-sm text-label-sm text-outline-variant px-1 group-focus-within:text-tertiary transition-colors">Password</label>
                    <input
                        class="w-full bg-transparent border-0 border-b border-white/10 focus:border-tertiary focus:ring-0 text-on-surface font-body-md px-1 py-2 transition-colors placeholder:text-white/10"
                        placeholder="••••••••" type="password">
                </div>
                <button
                    class="mt-4 liquid-glass rounded-full py-4 px-6 font-label-sm text-label-sm text-on-surface hover:bg-white/10 transition-all duration-300 flex items-center justify-center gap-2 group"
                    type="submit">
                    Enter Archive
                    <span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform"
                        style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
                </button>
            </form>
        </div>
    </main>
