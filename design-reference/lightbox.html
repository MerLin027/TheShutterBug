                    "fontFamily": {

                        "headline-lg": [

                        "body-lg": [

                        "label-sm": [

<body
    class="bg-primary-container min-h-screen w-full flex items-center justify-center overflow-hidden font-body-md text-on-surface">
    <!-- Main Lightbox Image Container -->
    <div class="relative w-full h-screen flex items-center justify-center p-4 md:p-12 lg:p-24">
        <!-- The Image -->
        <img alt=""
            class="max-w-full max-h-full object-contain rounded-lg shadow-2xl transition-transform duration-700 ease-out hover:scale-[1.01]"
            src="https://lh3.googleusercontent.com/aida/AP1WRLt_p_3taNJFKaIPQ9dLhmTlbuIjeo-4Mdjwxse2woumL9J8YXATt7K8hd6we0SjhDdAByWT6bH_c3Ksfvp5A7jRMee1bxkAfjI0uaOHxbnKXii9cEOZ_Oy354DfKYAfxNL9wGCTmdu05hFGXQntOjXgZoOoYz3dLj7t7ZlJ0y5AG0pdt9wB2Dju5ZaqpVasI-9BrLEkCzh-wXtx5RxXpcNdi6IDR3HflyyhHzAyCf6V70Ux-Y_EbuPgavk" />
        <!-- Subtle Caption Overlay -->
        <div class="absolute bottom-8 left-8 md:bottom-12 md:left-12 max-w-sm">
            <div
                class="backdrop-blur-[20px] bg-white/5 border border-white/10 rounded-xl p-4 transition-opacity duration-300">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-1">Silhouettes at Dusk</h2>
                <div class="flex items-center gap-2 text-on-surface-variant font-label-sm text-label-sm">
                    <span class="material-symbols-outlined text-[16px]" data-icon="location_on" data-weight="fill"
                        style="font-variation-settings: 'FILL' 1;">location_on</span>
                    <span>Nordic Coast</span>
                </div>
            </div>
        </div>
    </div>
    <!-- BottomNavBar (Lightbox Controls) -->
    <nav
        class="fixed bottom-10 left-1/2 -translate-x-1/2 w-fit rounded-full backdrop-blur-[20px] border-[0.5px] border-white/10 bg-white/5 dark:bg-white/5 flex gap-4 p-2 z-50">
        <!-- Previous -->
        <button aria-label="Previous"
            class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:opacity-100 transition-opacity hover:text-on-surface group">
            <span class="material-symbols-outlined group-active:scale-95 transition-transform duration-200"
                data-icon="arrow_back_ios">arrow_back_ios</span>
            <span
                class="font-label-sm text-label-sm mt-1 opacity-0 h-0 group-hover:opacity-100 group-hover:h-auto transition-all duration-300 overflow-hidden">Previous</span>
        </button>
        <!-- Info -->
        <button aria-label="Info"
            class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:opacity-100 transition-opacity hover:text-on-surface group">
            <span class="material-symbols-outlined group-active:scale-95 transition-transform duration-200"
                data-icon="info">info</span>
            <span
                class="font-label-sm text-label-sm mt-1 opacity-0 h-0 group-hover:opacity-100 group-hover:h-auto transition-all duration-300 overflow-hidden">Info</span>
        </button>
        <!-- Close (X) - Added for Lightbox specific context -->
        <button aria-label="Close"
            class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:opacity-100 transition-opacity hover:text-on-surface group">
            <span class="material-symbols-outlined group-active:scale-95 transition-transform duration-200"
                data-icon="close">close</span>
            <span
                class="font-label-sm text-label-sm mt-1 opacity-0 h-0 group-hover:opacity-100 group-hover:h-auto transition-all duration-300 overflow-hidden">Close</span>
        </button>
        <!-- Next -->
        <button aria-label="Next"
            class="flex flex-col items-center justify-center text-on-surface-variant px-6 py-2 hover:opacity-100 transition-opacity hover:text-on-surface group">
            <span class="material-symbols-outlined group-active:scale-95 transition-transform duration-200"
                data-icon="arrow_forward_ios">arrow_forward_ios</span>
            <span
                class="font-label-sm text-label-sm mt-1 opacity-0 h-0 group-hover:opacity-100 group-hover:h-auto transition-all duration-300 overflow-hidden">Next</span>
        </button>
    </nav>
</body>

</html>
