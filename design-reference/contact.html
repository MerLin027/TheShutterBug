<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>The Shutter Bug - Contact</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-container": "#474743",
                        "primary-fixed": "#e5e2e1",
                        "secondary": "#c8c6c2",
                        "on-tertiary": "#2a3137",
                        "inverse-surface": "#e5e2e1",
                        "tertiary-container": "#040b0f",
                        "error-container": "#93000a",
                        "surface-tint": "#c9c6c5",
                        "surface-dim": "#141313",
                        "on-tertiary-fixed-variant": "#40484d",
                        "error": "#ffb4ab",
                        "surface-container-high": "#2b2a2a",
                        "on-tertiary-fixed": "#151d21",
                        "surface-container-low": "#1c1b1b",
                        "surface-container-highest": "#353434",
                        "on-secondary-container": "#b7b5b0",
                        "on-secondary": "#31302d",
                        "surface-bright": "#3a3939",
                        "surface": "#141313",
                        "surface-container": "#201f1f",
                        "background": "#141313",
                        "on-error-container": "#ffdad6",
                        "surface-variant": "#353434",
                        "outline-variant": "#444748",
                        "on-surface-variant": "#c4c7c7",
                        "on-secondary-fixed-variant": "#474743",
                        "inverse-on-surface": "#313030",
                        "on-secondary-fixed": "#1c1c19",
                        "on-background": "#e5e2e1",
                        "on-error": "#690005",
                        "secondary-fixed": "#e5e2dd",
                        "tertiary-fixed": "#dce3ea",
                        "on-surface": "#e5e2e1",
                        "on-primary": "#313030",
                        "on-primary-fixed-variant": "#474646",
                        "tertiary": "#c0c7ce",
                        "secondary-fixed-dim": "#c8c6c2",
                        "on-tertiary-container": "#727a80",
                        "primary-fixed-dim": "#c9c6c5",
                        "primary": "#c9c6c5",
                        "inverse-primary": "#5f5e5e",
                        "on-primary-fixed": "#1c1b1b",
                        "tertiary-fixed-dim": "#c0c7ce",
                        "primary-container": "#0a0a0a",
                        "outline": "#8e9192",
                        "on-primary-container": "#7b7979"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "element-gap": "16px",
                        "gutter": "24px",
                        "section-gap": "120px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Space Grotesk"],

                        "headline-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "display-lg": ["84px", { "lineHeight": "92px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]

                }
            }
        }
    </script>
    <style>
        .liquid-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .liquid-glass-input {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .liquid-glass-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-bottom-color: #D4AF37;
            /* Accent highlight */
            box-shadow: 0 4px 20px -5px rgba(212, 175, 55, 0.15);
            outline: none;
        }

        /* Noise Overlay for texture */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>

<body
    class="bg-primary-container text-on-surface min-h-screen flex flex-col relative overflow-x-hidden selection:bg-tertiary selection:text-on-tertiary">
    <div class="noise-overlay"></div>
    <!-- TopNavBar -->
    <header
        class="fixed top-0 left-0 right-0 z-50 flex justify-center items-center w-full mt-6 px-margin-mobile md:px-margin-desktop pointer-events-none">
        <nav
            class="bg-white/10 backdrop-blur-[30px] rounded-full mx-auto w-fit px-8 py-3 border-[0.5px] border-white/15 flex items-center gap-8 pointer-events-auto shadow-none">
            <a class="font-headline-md text-headline-md tracking-tighter text-on-surface hover:text-primary transition-colors"
                href="#">The Shutter Bug</a>
            <div class="hidden md:flex items-center gap-6">
                <a class="font-label-sm text-label-sm tracking-widest text-on-surface/70 hover:bg-white/20 transition-all duration-300 px-3 py-1.5 rounded-full"
                    href="#">Work</a>
                <a class="font-label-sm text-label-sm tracking-widest text-on-surface/70 hover:bg-white/20 transition-all duration-300 px-3 py-1.5 rounded-full"
                    href="#">About</a>
                <a class="font-label-sm text-label-sm tracking-widest text-primary font-bold hover:bg-white/20 transition-all duration-300 px-3 py-1.5 rounded-full scale-105 active:scale-95 transition-transform"
                    href="#">Contact</a>
            </div>
            <button
                class="text-on-surface hover:bg-white/20 p-2 rounded-full transition-all duration-300 flex items-center justify-center scale-105 active:scale-95">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">grid_view</span>
            </button>
        </nav>
    </header>
    <!-- Main Content -->
    <main
        class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop pt-32 pb-section-gap relative z-10 w-full max-w-3xl mx-auto">
        <div class="text-center mb-16 space-y-6 animate-[fadeInUp_1s_ease-out]">
            <h1 class="font-display-lg text-display-lg text-on-surface">Get in Touch</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl mx-auto">Inquiries regarding
                commissions, licensing, or gallery exhibitions. We review all submissions within two business days.</p>
        </div>
        <form class="w-full space-y-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="relative group">
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1"
                        for="name">Name</label>
                    <input
                        class="w-full bg-transparent border-0 liquid-glass-input font-body-md text-body-md text-on-surface px-4 py-3 focus:ring-0 placeholder:text-on-surface-variant/50"
                        id="name" name="name" placeholder="Jane Doe" type="text">
                </div>
                <div class="relative group">
                    <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1"
                        for="email">Email</label>
                    <input
                        class="w-full bg-transparent border-0 liquid-glass-input font-body-md text-body-md text-on-surface px-4 py-3 focus:ring-0 placeholder:text-on-surface-variant/50"
                        id="email" name="email" placeholder="jane@example.com" type="email">
                </div>
            </div>
            <div class="relative group">
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1"
                    for="subject">Subject</label>
                <input
                    class="w-full bg-transparent border-0 liquid-glass-input font-body-md text-body-md text-on-surface px-4 py-3 focus:ring-0 placeholder:text-on-surface-variant/50"
                    id="subject" name="subject" placeholder="Commission Inquiry" type="text">
            </div>
            <div class="relative group">
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1"
                    for="message">Message</label>
                <textarea
                    class="w-full bg-transparent border-0 liquid-glass-input font-body-md text-body-md text-on-surface px-4 py-3 focus:ring-0 resize-none placeholder:text-on-surface-variant/50"
                    id="message" name="message" placeholder="Detail your project requirements here..."
                    rows="5"></textarea>
            </div>
            <div class="pt-8 flex justify-center">
                <button
                    class="liquid-glass rounded-full px-10 py-4 font-label-sm text-label-sm tracking-widest text-on-surface hover:bg-white/10 hover:shadow-[0_0_30px_rgba(255,255,255,0.05)] transition-all duration-500 ease-out active:scale-95 group flex items-center gap-3"
                    type="button">
                    SEND INQUIRY
                    <span
                        class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform duration-300">arrow_forward</span>
                </button>
            </div>
        </form>
    </main>
    <!-- Footer -->
    <footer
        class="w-full py-section-gap px-margin-desktop bg-transparent flex flex-col items-center justify-center gap-element-gap z-10 relative">
        <a class="font-headline-md text-headline-md text-on-surface opacity-80 hover:opacity-100 transition-opacity"
            href="#">The Shutter Bug</a>
        <div class="flex items-center gap-6 mt-4">
            <a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100"
                href="#">Instagram</a>
            <a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100"
                href="#">Twitter</a>
            <a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors opacity-80 hover:opacity-100"
                href="#">LinkedIn</a>
        </div>
        <p class="font-label-sm text-label-sm text-on-surface-variant mt-8 opacity-50">© 2024 The Shutter Bug. All
            rights reserved.</p>
    </footer>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>


</body>

</html>
