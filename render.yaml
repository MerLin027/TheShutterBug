# Reference only. The Render service was created in the dashboard, not from
# this Blueprint, so Render does not read this file; it mirrors the
# dashboard's settings (checked 2026-11-22). Change the dashboard first.
services:
  - type: web
    name: shutterbug-api
    env: node
    # Render runs every command from backend/, and only changes under it
    # trigger a deploy.
    rootDir: backend
    # npm ci: exactly what backend/package-lock.json records (the tested
    # versions); --omit=dev leaves developer-only packages off the server.
    # Node is pinned by "engines" in backend/package.json.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      # Same value as PROXY_KEY in the Vercel project: lets the API trust the
      # visitor address the site's /api proxy passes on (src/proxy.ts).
      - key: PROXY_KEY
        sync: false
