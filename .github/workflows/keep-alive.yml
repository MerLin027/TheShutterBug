# Keeps the Render free-tier API awake.
#
# Render spins a free web service down after 15 minutes without traffic, and
# waking it took 32.7 s when measured (2026-11-21). The docs said a
# cron-job.org job pinged /api/health; the owner confirmed there is none.
#
# /api/health makes no database call. Free for a public repository. Note:
# GitHub runs schedules on a best-effort basis (a run can be late), and it
# disables scheduled workflows in a repository with no commits for 60 days;
# re-enable it from the Actions tab if that happens.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 90 --retry 2 https://theshutterbug.onrender.com/api/health
